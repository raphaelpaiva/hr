<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Gravador Sem Cabeça - Sessão</title>
    <script src="/static/js/tailwind.config.js"></script>
    <script src="/static/js/tailwind.min.js"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/app.js"></script>
</head>
<body class="min-h-screen flex flex-col">

    <header id="app-header" data-page="session-detail"></header>

    <main class="flex-1 max-w-5xl mx-auto w-full px-4 md:px-6 py-6 md:py-10 flex flex-col gap-8">

        <a href="/sessions" class="text-sm text-gray-400 hover:text-white transition-colors font-medium inline-flex items-center gap-2 w-fit">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Voltar para todas as sessões
        </a>

        <!-- Cartão Superior: Controles da Sessão -->
        <div class="card-bg rounded-3xl border border-custom p-6 md:p-10 flex flex-col md:flex-row gap-8 md:gap-10">

            <!-- Coluna Esquerda: Inputs -->
            <div class="flex-1 flex flex-col justify-center gap-8">

                <!-- Nome da Sessão -->
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">Nome da Sessão</label>
                    <div class="relative">
                        <input id="sessionName" type="text" value="" readonly
                               class="input-bg border border-custom rounded-xl w-full py-4 pl-5 pr-12 text-gray-100 font-medium focus:outline-none focus:border-red-500/50 transition-colors">
                        <button id="btnRename" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors" title="Renomear sessão">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Dispositivos de Entrada -->
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3">Dispositivos de Entrada</label>
                    <div class="relative">
                        <select id="deviceSelect" class="input-bg border border-custom rounded-xl w-full py-4 pl-5 pr-12 text-gray-100 font-medium appearance-none focus:outline-none focus:border-red-500/50 transition-colors cursor-pointer">
                            <option value="all" class="bg-card">Carregando dispositivos...</option>
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>

                    <!-- Tags de Dispositivos -->
                    <div id="deviceTags" class="flex flex-wrap gap-3 mt-4"></div>
                </div>
            </div>

            <!-- Divisor -->
            <div class="hidden md:block w-px bg-[#332b2b] my-4"></div>

            <!-- Coluna Direita: Botão de Gravar -->
            <div class="w-full md:w-80 flex flex-col items-center justify-center pt-2">
                <!-- Status -->
                <div id="recPill" class="bg-red-500/10 text-red-500 px-5 py-2 rounded-full text-xs font-bold tracking-widest flex items-center gap-2 mb-8 border border-red-500/20">
                    <div id="recDot" class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></div>
                    <span id="recPillText">PRONTO PARA GRAVAR</span>
                </div>

                <!-- Botão Gigante -->
                <div class="relative group cursor-pointer">
                    <div id="recGlow" class="absolute inset-0 bg-red-600 rounded-full blur-[40px] opacity-40 group-hover:opacity-60 transition-opacity duration-500"></div>

                    <button id="btnRecord" class="relative w-44 h-44 md:w-48 md:h-48 bg-gradient-to-b from-[#ef4444] to-[#b91c1c] rounded-full flex flex-col items-center justify-center text-white border-4 border-[#2a1a1a] glow-effect group-hover:scale-105 transition-all duration-300">
                        <svg id="recIcon" class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path id="recIconPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                        </svg>
                        <span id="recLabel" class="font-black tracking-widest text-sm mt-1">GRAVAR</span>
                    </button>
                </div>

                <p id="recHint" class="text-xs text-gray-500 text-center mt-8 max-w-[220px] leading-relaxed">
                    Pressione para iniciar uma nova tomada. O sistema criará arquivos separados por canal.
                </p>
            </div>
        </div>

        <!-- Cartão Inferior: Histórico de Tomadas -->
        <div>
            <!-- Cabeçalho da Lista -->
            <div class="flex items-center justify-between mb-4 px-2">
                <div class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <h2 class="text-xl font-bold text-white">Tomadas Recentes</h2>
                </div>
                <div id="takeCount" class="text-xs font-medium text-gray-400 bg-card border border-custom px-4 py-1.5 rounded-full">
                    Sessão Atual: 0 Tomadas
                </div>
            </div>

            <!-- Tabela -->
            <div class="card-bg border border-custom rounded-3xl overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[640px]">
                    <thead>
                        <tr class="border-b border-custom text-[10px] uppercase tracking-widest text-gray-500">
                            <th class="px-6 md:px-8 py-5 font-bold w-24"># Index</th>
                            <th class="px-6 py-5 font-bold">Nome da Tomada</th>
                            <th class="px-6 py-5 font-bold">Dispositivos</th>
                            <th class="px-6 py-5 font-bold">Data/Hora</th>
                            <th class="px-6 md:px-8 py-5 font-bold text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="takesBody" class="text-sm font-medium text-gray-300">
                    </tbody>
                </table>

                <!-- Footer da Tabela -->
                <div class="border-t border-custom px-6 py-4 flex justify-center bg-surface/50">
                    <a href="/sessions" class="text-xs text-gray-400 hover:text-white transition-colors flex items-center gap-2 font-semibold">
                        Ver todas as tomadas
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </a>
                </div>
            </div>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="py-8 text-center text-xs text-gray-500 font-medium">
        <span id="app-git-info"></span>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('id');

        if (!sessionId) {
            alert("ID da sessão não encontrado!");
            window.location.href = '/sessions';
        }

        let sessionData = null;
        let isRecording = false;
        let selectedDevices = [];
        let availableDevices = [];
        let recStartTime = null;
        let recTimer = null;

        const el = {
            name: document.getElementById('sessionName'),
            btnRename: document.getElementById('btnRename'),
            deviceSelect: document.getElementById('deviceSelect'),
            deviceTags: document.getElementById('deviceTags'),
            recPill: document.getElementById('recPill'),
            recDot: document.getElementById('recDot'),
            recPillText: document.getElementById('recPillText'),
            btnRecord: document.getElementById('btnRecord'),
            recGlow: document.getElementById('recGlow'),
            recIcon: document.getElementById('recIcon'),
            recIconPath: document.getElementById('recIconPath'),
            recLabel: document.getElementById('recLabel'),
            recHint: document.getElementById('recHint'),
            takesBody: document.getElementById('takesBody'),
            takeCount: document.getElementById('takeCount'),
        };

        // --- Dispositivos ---
        async function loadDevices() {
            try {
                const data = await api('/devices');
                availableDevices = (data.devices || [])
                    .filter(d => d.name.startsWith('plughw'))
                    .map(d => d.name);
                renderDeviceSelect();
            } catch (e) {
                el.deviceSelect.innerHTML = '<option value="all" class="bg-card">Nenhum dispositivo encontrado</option>';
            }
        }

        function renderDeviceSelect() {
            const n = availableDevices.length;
            el.deviceSelect.innerHTML = `<option value="all" class="bg-card">Todos os Dispositivos (${n})</option>` +
                availableDevices.map(d => `<option value="${d}" class="bg-card">${d}</option>`).join('');
            el.deviceSelect.value = 'all';
            setSelectedDevices(availableDevices.slice());
        }

        function setSelectedDevices(devices) {
            selectedDevices = devices;
            renderDeviceTags();
        }

        function renderDeviceTags() {
            el.deviceTags.innerHTML = '';
            selectedDevices.forEach(name => {
                const tag = document.createElement('div');
                tag.className = 'input-bg border border-custom rounded-full px-4 py-1.5 text-xs text-gray-400 flex items-center gap-2';
                tag.innerHTML = `
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    <span>${name}</span>
                    <button class="text-gray-500 hover:text-red-400 transition-colors" title="Remover dispositivo">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>`;
                tag.querySelector('button').onclick = () => removeDevice(name);
                el.deviceTags.appendChild(tag);
            });
        }

        function removeDevice(name) {
            const next = selectedDevices.filter(d => d !== name);
            if (next.length === 0) {
                el.deviceSelect.value = 'all';
                setSelectedDevices(availableDevices.slice());
            } else {
                setSelectedDevices(next);
            }
        }

        el.deviceSelect.addEventListener('change', () => {
            if (el.deviceSelect.value === 'all') {
                setSelectedDevices(availableDevices.slice());
            } else {
                setSelectedDevices([el.deviceSelect.value]);
            }
        });

        // --- Sessão ---
        async function loadSession() {
            try {
                sessionData = await api(`/session/${sessionId}`);
                el.name.value = sessionData.name;
                renderTakes(sessionData.takes || []);
            } catch (e) {
                alert('Erro ao carregar sessão.');
            }
        }

        function renderTakes(takes) {
            el.takeCount.textContent = `Sessão Atual: ${takes.length} ${takes.length === 1 ? 'Tomada' : 'Tomadas'}`;
            el.takesBody.innerHTML = '';

            if (!takes.length) {
                el.takesBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-14 text-center text-gray-500">
                            Nenhuma tomada gravada ainda. Pressione GRAVAR para começar.
                        </td>
                    </tr>`;
                return;
            }

            takes.slice().reverse().forEach((take, idx) => {
                const isLast = idx === takes.length - 1;
                const tr = document.createElement('tr');
                tr.className = `border-b border-custom hover:bg-[#2a2424] transition-colors${isLast ? ' border-b-0' : ''}`;

                const channels = (take.recordings || []).length;
                const zipUrl = `/api/v1/session/${sessionId}/take/${take.id}/zip`;

                tr.innerHTML = `
                    <td class="px-6 md:px-8 py-6 font-mono text-gray-500">${String(take.index).padStart(3, '0')}</td>
                    <td class="px-6 py-6 text-white font-semibold">${take.name}</td>
                    <td class="px-6 py-6 text-gray-400 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        ${channels} ${channels === 1 ? 'Canal' : 'Canais'}
                    </td>
                    <td class="px-6 py-6 text-gray-400 font-mono text-xs">${formatTakeTimestamp(take.created_at)}</td>
                    <td class="px-6 md:px-8 py-6 text-right">
                        <a href="${zipUrl}" class="input-bg border border-custom hover:border-gray-500 text-gray-300 px-4 py-2 rounded-full text-xs font-semibold transition-colors inline-flex items-center gap-2">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Baixar (ZIP)
                        </a>
                    </td>`;
                el.takesBody.appendChild(tr);
            });
        }

        // --- Botão de Gravar ---
        function updateRecordButton() {
            if (isRecording) {
                el.btnRecord.className = 'relative w-44 h-44 md:w-48 md:h-48 bg-gradient-to-b from-slate-600 to-slate-900 rounded-full flex flex-col items-center justify-center text-white border-4 border-[#2a1a1a] group-hover:scale-105 transition-all duration-300';
                el.recIconPath.setAttribute('d', 'M6 6h12v12H6z');
                el.recLabel.textContent = 'PARAR';
                el.recGlow.className = 'absolute inset-0 bg-slate-700 rounded-full blur-[40px] opacity-50';
                el.recPill.className = 'bg-red-500/20 text-red-400 px-5 py-2 rounded-full text-xs font-bold tracking-widest flex items-center gap-2 mb-8 border border-red-500/30';
                el.recDot.className = 'w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse';
                el.recPillText.textContent = 'GRAVANDO...';
            } else {
                el.btnRecord.className = 'relative w-44 h-44 md:w-48 md:h-48 bg-gradient-to-b from-[#ef4444] to-[#b91c1c] rounded-full flex flex-col items-center justify-center text-white border-4 border-[#2a1a1a] glow-effect group-hover:scale-105 transition-all duration-300';
                el.recIconPath.setAttribute('d', 'M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z');
                el.recLabel.textContent = 'GRAVAR';
                el.recGlow.className = 'absolute inset-0 bg-red-600 rounded-full blur-[40px] opacity-40 group-hover:opacity-60 transition-opacity duration-500';
                el.recPill.className = 'bg-red-500/10 text-red-500 px-5 py-2 rounded-full text-xs font-bold tracking-widest flex items-center gap-2 mb-8 border border-red-500/20';
                el.recDot.className = 'w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse';
                el.recPillText.textContent = 'PRONTO PARA GRAVAR';
            }
        }

        function startElapsedTimer() {
            recStartTime = Date.now();
            clearInterval(recTimer);
            recTimer = setInterval(() => {
                const s = Math.floor((Date.now() - recStartTime) / 1000);
                const hh = String(Math.floor(s / 3600)).padStart(2, '0');
                const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
                const ss = String(s % 60).padStart(2, '0');
                el.recPillText.textContent = `GRAVANDO ${hh}:${mm}:${ss}`;
            }, 1000);
        }

        function stopElapsedTimer() {
            clearInterval(recTimer);
            recStartTime = null;
        }

        el.btnRecord.addEventListener('click', async () => {
            el.btnRecord.disabled = true;
            try {
                if (!isRecording) {
                    if (!selectedDevices.length) {
                        alert('Selecione pelo menos um dispositivo de entrada.');
                        return;
                    }
                    await api(`/session/${sessionId}/take/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ devices: selectedDevices }),
                    });
                    isRecording = true;
                    startElapsedTimer();
                    updateRecordButton();
                } else {
                    await api(`/session/${sessionId}/take/stop`, { method: 'POST' });
                    isRecording = false;
                    stopElapsedTimer();
                    updateRecordButton();
                    loadSession();
                }
            } catch (e) {
                alert(e.message || 'Erro ao controlar a gravação.');
            } finally {
                el.btnRecord.disabled = false;
            }
        });

        // --- Renomear ---
        el.btnRename.addEventListener('click', () => {
            el.name.readOnly = false;
            el.name.focus();
            el.name.classList.add('focus:border-red-500/50');
        });

        async function saveName() {
            const name = el.name.value.trim();
            if (!name) {
                el.name.value = sessionData.name;
                return;
            }
            if (name === sessionData.name) return;
            try {
                sessionData = await api(`/session/${sessionId}/rename`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name }),
                });
            } catch (e) {
                el.name.value = sessionData.name;
            }
        }

        el.name.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { el.name.blur(); }
            if (e.key === 'Escape') {
                el.name.value = sessionData.name;
                el.name.readOnly = true;
            }
        });
        el.name.addEventListener('blur', () => {
            el.name.readOnly = true;
            saveName();
        });

        // --- Inicialização ---
        loadDevices();
        loadSession();
    </script>
</body>
</html>
