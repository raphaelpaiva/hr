<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Gravador Sem Cabeça</title>
    <script src="/static/js/tailwind.config.js"></script>
    <script src="/static/js/tailwind.min.js"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/app.js"></script>
</head>
<body class="min-h-screen flex flex-col">

    <header id="app-header" data-page="dashboard"></header>

    <main class="flex-1 max-w-5xl mx-auto w-full px-4 md:px-6 py-8 md:py-10 flex flex-col gap-8">

        <div class="flex items-center justify-between px-2">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-white">Painel de Controle</h1>
                <p class="text-sm text-gray-500 mt-1">Controle as gravações do estúdio em tempo real.</p>
            </div>
        </div>

        <!-- Nova Gravação -->
        <div class="card-bg rounded-3xl border border-custom p-6 md:p-8">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-full bg-red-500/10 flex items-center justify-center text-red-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-white">Nova Gravação</h3>
            </div>

            <div class="flex flex-wrap items-center gap-4">
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1 w-full">Dispositivo de Entrada</label>
                <div class="relative flex-1 min-w-[250px]">
                    <select id="deviceSelect" class="input-bg border border-custom rounded-xl w-full py-4 pl-5 pr-12 text-gray-100 font-medium appearance-none focus:outline-none focus:border-red-500/50 transition-colors cursor-pointer">
                        <option value="" disabled selected class="bg-card">Carregando dispositivos...</option>
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
                <button id="btnRecord" class="bg-gradient-to-b from-[#ef4444] to-[#b91c1c] hover:from-red-500 hover:to-red-700 text-white font-black py-4 px-8 rounded-full transition-all shadow-[0_0_15px_rgba(229,57,53,0.3)] text-sm tracking-widest">
                    INICIAR GRAVAÇÃO
                </button>
            </div>

            <div class="mt-4 flex items-center gap-2">
                <input id="showAllDevices" type="checkbox" class="w-4 h-4 accent-red-500 bg-surface border-custom rounded">
                <label for="showAllDevices" class="ml-2 text-sm font-medium text-gray-400 select-none cursor-pointer">Mostrar todos os dispositivos (incluindo hardware interno)</label>
            </div>

            <div id="lastRecordResult" class="hidden mt-4 p-4 bg-card border border-custom rounded-xl text-red-400 font-mono text-sm"></div>
            <p id="statusMsg" class="mt-2 text-sm h-5 text-red-500"></p>
        </div>

        <!-- Gravações Ativas -->
        <div class="card-bg rounded-3xl border border-custom overflow-hidden">
            <div class="flex justify-between items-center mb-4 px-6 md:px-8 pt-6">
                <div class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15.536a5 5 0 001.414-7.072m-2.828 9.9a9 9 0 010-12.728M12 12a1 1 0 100-2 1 1 0 000 2zm0 0v4"></path></svg>
                    <h3 class="text-lg font-bold text-white">Gravações Ativas</h3>
                </div>
                <button onclick="loadRecordings()" class="input-bg border border-custom hover:border-gray-500 text-gray-400 hover:text-white text-sm font-semibold py-2 px-4 rounded-full transition-colors">
                    ↻ Atualizar
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[640px]">
                    <thead>
                        <tr class="border-y border-custom text-[10px] uppercase tracking-widest text-gray-500 bg-surface/50">
                            <th class="px-6 md:px-8 py-4 font-bold">Ações</th>
                            <th class="px-6 py-4 font-bold">ID</th>
                            <th class="px-6 py-4 font-bold">Dispositivo</th>
                            <th class="px-6 py-4 font-bold">Estado</th>
                            <th class="px-6 md:px-8 py-4 font-bold">Criado em</th>
                        </tr>
                    </thead>
                    <tbody id="recordingsTable" class="text-sm font-medium text-gray-300"></tbody>
                </table>
            </div>
        </div>

        <!-- Histórico -->
        <div class="card-bg rounded-3xl border border-custom overflow-hidden">
            <div class="flex justify-between items-center mb-4 px-6 md:px-8 pt-6">
                <div class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <h3 class="text-lg font-bold text-white">Histórico</h3>
                </div>
                <button onclick="loadHistory()" class="input-bg border border-custom hover:border-gray-500 text-gray-400 hover:text-white text-sm font-semibold py-2 px-4 rounded-full transition-colors">
                    ↻ Atualizar
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[640px]">
                    <thead>
                        <tr class="border-y border-custom text-[10px] uppercase tracking-widest text-gray-500 bg-surface/50">
                            <th class="px-6 md:px-8 py-4 font-bold">Download</th>
                            <th class="px-6 py-4 font-bold">ID</th>
                            <th class="px-6 py-4 font-bold">Dispositivo</th>
                            <th class="px-6 py-4 font-bold">Estado</th>
                            <th class="px-6 md:px-8 py-4 font-bold">Modificação</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable" class="text-sm font-medium text-gray-300"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="py-8 text-center text-xs text-gray-500 font-medium">
        &copy; 2023 O Gravador Sem Cabeça. Sistema operacional v2.0.
    </footer>

    <script>
        let allDevices = [];

        const select = document.getElementById('deviceSelect');
        const btnRecord = document.getElementById('btnRecord');
        const statusMsg = document.getElementById('statusMsg');
        const lastRecordResult = document.getElementById('lastRecordResult');
        const tableBodyRecordings = document.querySelector('#recordingsTable');
        const tableBodyHistory = document.querySelector('#historyTable');
        const showAllCheckbox = document.getElementById('showAllDevices');

        const STATE_ICONS = {
            'recording': '<span class="text-lg leading-none text-red-500">🔴</span>',
            'new': '<span class="text-lg leading-none text-yellow-500">🟡</span>',
            'stopped': '<span class="text-lg leading-none text-green-400">✅</span>'
        };

        // --- Lógica de Dispositivos ---
        function renderDevices() {
            const showAll = showAllCheckbox.checked;

            select.innerHTML = '<option value="" disabled selected class="bg-card">Selecione um dispositivo</option>';

            let filtered = allDevices.filter(d => {
                if (d.name === 'null') return true;
                if (showAll) return true;
                return d.name.startsWith('plughw');
            });

            filtered.sort((a, b) => {
                if (a.name === 'null') return -1;
                if (b.name === 'null') return 1;
                return a.name.localeCompare(b.name);
            });

            filtered.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.name;
                opt.textContent = d.name;
                opt.className = 'bg-card';
                select.appendChild(opt);
            });
        }

        async function loadDevices() {
            try {
                const data = await api('/devices');
                allDevices = data.devices || [];
                renderDevices();
            } catch (e) {
                statusMsg.textContent = 'Erro ao carregar dispositivos.';
            }
        }

        showAllCheckbox.addEventListener('change', renderDevices);

        btnRecord.addEventListener('click', async () => {
            if (!select.value) return;
            btnRecord.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/record`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device: select.value })
                });
                if (res.ok) {
                    const d = await res.json();
                    lastRecordResult.innerHTML = `Gravação <strong>${d.id.substring(0, 8)}</strong> iniciada.`;
                    lastRecordResult.classList.remove('hidden');
                    loadRecordings();
                }
            } finally {
                btnRecord.disabled = false;
            }
        });

        // --- Tabelas ---
        function createTableRow(rec, isHistory = false) {
            const tr = document.createElement('tr');
            tr.className = "border-b border-custom hover:bg-[#2a2424] transition-colors";

            const tdAction = document.createElement('td');
            tdAction.className = 'px-6 md:px-8 py-4';
            const actions = document.createElement('div');
            actions.className = 'flex items-center gap-2';

            const link = document.createElement('a');
            link.href = `/api/v1/result/${rec.id}`;
            link.className = 'w-9 h-9 flex items-center justify-center bg-surface text-cyan-400 rounded-lg border border-custom hover:border-cyan-500 transition-colors';
            link.innerHTML = '⤓';
            actions.appendChild(link);

            if (!isHistory) {
                const btnStop = document.createElement('button');
                btnStop.innerHTML = '⏹';
                if (rec.state === 'recording') {
                    btnStop.className = 'w-9 h-9 flex items-center justify-center bg-surface text-red-500 rounded-lg border border-custom hover:border-red-500 transition-colors';
                    btnStop.onclick = () => stopRecording(rec.id);
                } else {
                    btnStop.className = 'w-9 h-9 flex items-center justify-center bg-surface text-gray-600 rounded-lg border border-custom cursor-not-allowed';
                }
                actions.appendChild(btnStop);
            }
            tdAction.appendChild(actions);
            tr.appendChild(tdAction);

            const cell = (html, cls = 'px-6 py-4') => {
                const td = document.createElement('td');
                td.className = cls;
                td.innerHTML = html;
                tr.appendChild(td);
            };
            cell(`<span class="font-mono text-gray-500">${rec.id.substring(0, 8)}</span>`);
            cell(`<span class="font-medium text-white">${rec.device_name}</span>`);
            cell(STATE_ICONS[rec.state] || rec.state);
            cell(`<span class="text-gray-400 font-mono text-xs">${formatTimestamp(isHistory ? rec.last_modification : rec.created_at)}</span>`);

            return tr;
        }

        async function loadRecordings() {
            try {
                const data = await api('/recordings');
                const list = data.recordings || data;
                tableBodyRecordings.innerHTML = '';
                list.sort((a, b) => b.created_at - a.created_at).forEach(r => tableBodyRecordings.appendChild(createTableRow(r, false)));
            } catch (e) {}
        }

        async function loadHistory() {
            try {
                const data = await api('/history');
                const list = data.history || data;
                tableBodyHistory.innerHTML = '';
                list.sort((a, b) => b.created_at - a.created_at).forEach(r => tableBodyHistory.appendChild(createTableRow(r, true)));
            } catch (e) {}
        }

        async function stopRecording(id) {
            await api('/stop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            });
            loadRecordings();
            loadHistory();
        }

        loadDevices();
        loadRecordings();
        loadHistory();
    </script>
</body>
</html>
